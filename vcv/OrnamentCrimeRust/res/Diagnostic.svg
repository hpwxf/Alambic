<?xml version="1.0" encoding="UTF-8"?>
<!-- Panel background for the Diagnostic module. Component graphics (screen,
     knobs, buttons, jacks) are drawn by VCV Rack itself from the widget
     positions in Diagnostic.cpp; this file only supplies the silkscreen
     art behind/around them, so it must stay in sync with those mm2px()
     offsets by eye. Layout mirrors the real O&C hardware: screen up top,
     UP/DOWN + two push-encoders in the middle, then three 4-wide jack rows
     (TRIG IN / CV IN / OUT) at the bottom. -->
<svg xmlns="http://www.w3.org/2000/svg" width="71.12mm" height="128.5mm"
     viewBox="0 0 71.12 128.5" font-family="'DejaVu Sans Mono', monospace">

  <!-- Panel base -->
  <rect x="0" y="0" width="71.12" height="128.5" fill="#1c1c1c" />
  <rect x="1" y="1" width="69.12" height="126.5" fill="none" stroke="#3a3a3a" stroke-width="0.5" />

  <!-- Title -->
  <text x="35.56" y="5.6" font-size="3.6" fill="#d8d8d8" text-anchor="middle" font-weight="bold">O&amp;C &#183; RUST</text>
  <text x="35.56" y="126.5" font-size="2.6" fill="#5a5a5a" text-anchor="middle">Diagnostic</text>

  <!-- Screen bezel. Widget sits at (12.56,9) size (46,23); this frame is
       1mm larger on every side so a thin rim stays visible around it. -->
  <rect x="11.56" y="8" width="48" height="25" rx="1" fill="#050505" stroke="#4a4a4a" stroke-width="0.4" />

  <!-- UP / DOWN buttons, one above each encoder -->
  <path d="M 21.10 34.6 L 22.7 37.2 L 19.5 37.2 Z" fill="#8a8a8a" />
  <path d="M 50.02 37.2 L 51.62 34.6 L 48.42 34.6 Z" fill="#8a8a8a" />

  <!-- Encoder mounting rings + labels (knobs at y=50, push-switches at y=60) -->
  <circle cx="21.10" cy="50" r="5.6" fill="none" stroke="#050505" stroke-width="0.3" />
  <circle cx="50.02" cy="50" r="5.6" fill="none" stroke="#050505" stroke-width="0.3" />
  <text x="21.10" y="56.6" font-size="2.1" fill="#808080" text-anchor="middle">SEL</text>
  <text x="50.02" y="56.6" font-size="2.1" fill="#808080" text-anchor="middle">OFS</text>

  <!-- Divider between control section and I/O section -->
  <line x1="6" y1="65.5" x2="65.12" y2="65.5" stroke="#303030" stroke-width="0.3" />

  <!-- TRIG IN row -->
  <text x="36" y="70.4" font-size="3" fill="#a0a0a0" text-anchor="middle" letter-spacing="0.3">TRIG IN</text>
  <text x="12" y="75.6" font-size="2.4" fill="#707070" text-anchor="middle">1</text>
  <text x="28" y="75.6" font-size="2.4" fill="#707070" text-anchor="middle">2</text>
  <text x="44" y="75.6" font-size="2.4" fill="#707070" text-anchor="middle">3</text>
  <text x="60" y="75.6" font-size="2.4" fill="#707070" text-anchor="middle">4</text>

  <!-- CV IN row -->
  <text x="36" y="90.4" font-size="3" fill="#a0a0a0" text-anchor="middle" letter-spacing="0.3">CV IN</text>
  <text x="12" y="95.6" font-size="2.4" fill="#707070" text-anchor="middle">1</text>
  <text x="28" y="95.6" font-size="2.4" fill="#707070" text-anchor="middle">2</text>
  <text x="44" y="95.6" font-size="2.4" fill="#707070" text-anchor="middle">3</text>
  <text x="60" y="95.6" font-size="2.4" fill="#707070" text-anchor="middle">4</text>

  <!-- OUT row -->
  <text x="36" y="110.4" font-size="3" fill="#c8b26a" text-anchor="middle" letter-spacing="0.3">OUT</text>
  <text x="12" y="115.6" font-size="2.4" fill="#a0925c" text-anchor="middle">A</text>
  <text x="28" y="115.6" font-size="2.4" fill="#a0925c" text-anchor="middle">B</text>
  <text x="44" y="115.6" font-size="2.4" fill="#a0925c" text-anchor="middle">C</text>
  <text x="60" y="115.6" font-size="2.4" fill="#a0925c" text-anchor="middle">D</text>
</svg>
