[workspace]
resolver = "3"
members = [
    "crates/oc-buildinfo",
    "crates/oc-core",
    "crates/oc-drivers",
    "crates/oc-dsp",
    "crates/oc-firmware",
    "crates/oc-halfkay",
    "crates/oc-image",
    "crates/oc-probe",
    "crates/oc-protocol",
    "crates/oc-sim",
    "crates/oc-vcv-ffi",
    "crates/oc-web",
    "xtask",
]

# `oc-firmware` only builds for `thumbv7em-none-eabihf`, so it is deliberately
# excluded from the default set: bare `cargo build`, `cargo test` and
# `cargo clippy` then operate on host crates only. The firmware is built
# explicitly with `cargo xtask build` (or `cargo fw`).
default-members = [
    "crates/oc-buildinfo",
    "crates/oc-core",
    "crates/oc-drivers",
    "crates/oc-dsp",
    "crates/oc-halfkay",
    "crates/oc-image",
    "crates/oc-probe",
    "crates/oc-protocol",
    "crates/oc-sim",
    "crates/oc-vcv-ffi",
    "crates/oc-web",
    "xtask",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hpwxf/Alambic"
authors = ["Pascal Havé"]

[workspace.dependencies]
oc-core = { path = "crates/oc-core", version = "0.6.0" }
oc-drivers = { path = "crates/oc-drivers", version = "0.6.0" }
oc-dsp = { path = "crates/oc-dsp", version = "0.6.0" }
oc-protocol = { path = "crates/oc-protocol", version = "0.6.0" }
oc-image = { path = "crates/oc-image" }
oc-halfkay = { path = "crates/oc-halfkay" }
oc-probe = { path = "crates/oc-probe", default-features = false }
# Build-script helper only: computes the build identifier (journal/D-025).
oc-buildinfo = { path = "crates/oc-buildinfo" }
# Reads the commit and dirty state for oc-buildinfo through gitoxide (pure
# Rust): no `git` binary needed. `emit_and_set` exposes the values to the
# build script itself, which composes OC_BUILD_ID from them.
vergen-gix = { version = "10.0.3", features = ["emit_and_set"] }

# Host tooling
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
# SHA-256 of firmware images, printed by `cargo xtask flash` and the browser
# flasher before confirmation (oc-image).
sha2 = "0.10"
# Generates the C header for oc-vcv-ffi from its own build script; only the
# library API is needed, not cbindgen's own command-line front end.
cbindgen = { version = "0.29", default-features = false }

# Browser tool (oc-web, journal/D-031). Pinned exactly: the `wasm-bindgen`
# command line `cargo xtask web` runs must be the same version, which it checks
# against Cargo.lock.
wasm-bindgen = "=0.2.129"

# Shared embedded/host libraries
embedded-graphics = "0.8.2"
embedded-hal = "1.0"
# Settings persistence (journal/D-028): postcard encodes the settings,
# sequential-storage keeps them in flash with wear levelling and CRCs over the
# embedded-storage NorFlash traits; embassy-futures drives its async API to
# completion from the blocking 1 kHz loop.
embedded-storage-async = "0.4.2"
embassy-futures = "0.1.2"
postcard = { version = "1.1.3", default-features = false }
sequential-storage = { version = "8.0.2", features = ["postcard"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }

# Terminal UI for the simulator. Only the crossterm backend is enabled; the
# default feature set also pulls in the calendar widget and alternative
# backends we have no use for.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }

# Test & bench tooling
# `html_reports`: `cargo bench` also writes target/criterion/report/index.html.
criterion = { version = "0.7", features = ["html_reports"] }
proptest = "1.7"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Numeric casts are pervasive and deliberate in DSP/fixed-point code; they are
# reviewed case by case with explicit `#[allow]` where a cast is not obvious.
module_name_repetitions = "allow"

[profile.release]
# `debug = 2` costs nothing in flash (debug info is not loaded onto the target)
# but is required by defmt/panic backtraces and by `cargo xtask size`.
debug = 2
codegen-units = 1
lto = "fat"
# Size by default (journal/D-038, revision of 2026-11-26): most of the code
# (the engine, the applets' control, menus, text and graphics, USB, the
# probe, the settings) runs at 1 kHz or less, far inside its budget, and the
# ITCM it lives in is the scarce memory. What must be fast says so below,
# crate by crate: with fat LTO a function keeps the level of the crate it is
# generated in (generic and `#[inline]` code where it is instantiated), and
# stable Rust has no per-function level. "s" rather than "z": the latter's
# outliner is the least exercised path (it exposed the early LPSPI flush).
opt-level = "s"
overflow-checks = true

# The DSP: the oscillators' coefficients, prepared whenever a parameter
# moves (`publish`, up to four slots a tick), and the blocks every sample
# runs. At "s" in `oc-core`, four modulated SUPERSAWs cost `publish` +33 %.
[profile.release.package.oc-dsp]
opt-level = 3
# The firmware: the audio interrupt (47 619 runs a second, 21 us each) and
# the per-sample path it instantiates (`Voices`, the generators, inlined
# from `oc-core` and `oc-dsp`), with the loop around them.
[profile.release.package.oc-firmware]
opt-level = 3
# VCV Rack's module: the same per-sample path, instantiated here, at Rack's
# sample rate.
[profile.release.package.oc-vcv-ffi]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Benchmarks must never run with a debug-instrumented profile.
[profile.bench]
debug = 2
lto = "thin"
