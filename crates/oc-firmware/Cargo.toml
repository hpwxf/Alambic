[package]
name = "oc-firmware"
description = "Ornament & Crime firmware for the Teensy 4.0 (i.MX RT1062)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
oc-core.workspace = true
oc-drivers.workspace = true

# `rt` pulls in `imxrt-rt`, which generates `t4link.x` (memory map + FlexSPI
# Configuration Block + Image Vector Table) and provides the reset handler.
teensy4-bsp = { version = "0.6", features = ["rt"] }
# `log` forwards the panic message through the `log` facade before the SOS
# blink; useful once the USB CDC backend below is up.
teensy4-panic = { version = "0.3", features = ["log"] }
# `critical-section-single-core` provides the critical-section impl that
# `imxrt-log` needs on a bare-metal single-core target.
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# The state the 1 kHz loop and the audio interrupt share (journal/D-033),
# behind cortex-m's implementation above.
critical-section = "1"
embedded-hal.workspace = true
# USB: two CDC serial ports, the text log and the probe (journal/D-029),
# polled from the main loop with interrupts off. The BSP re-exports the
# controller driver (imxrt-usbd); these are the stack and the class it
# plugs into, the ones imxrt-log used before, and the cell that gives the
# bus allocator its 'static lifetime.
# `control-buffer-256`: the configuration descriptor of two CDC ports is
# 141 bytes (9 + 2 x 66), over the default 128-byte control buffer; without
# it the host's descriptor request fails and the device never enumerates.
usb-device = { version = "0.3", features = ["control-buffer-256"] }
usbd-serial = "0.2"
static_cell = "2"
log = { version = "0.4", default-features = false }
# The probe protocol and its server, tested on the host.
oc-protocol.workspace = true
# The settings store (journal/D-028): the firmware provides the NorFlash it
# runs on, and calls the boot ROM with the configuration block this image
# boots with, which teensy4-fcb defines (the same crate the BSP links).
embedded-storage-async.workspace = true
teensy4-fcb = "0.5"
# Computes the build identifier shown on the splash screen (journal/D-025).
[build-dependencies]
oc-buildinfo.workspace = true

[features]
# Stock O&C panels are SH1106 (the default). These opt into the other
# controllers used on some third-party builds. Getting the choice wrong gives
# a blank or garbled screen with no other symptom.
ssd1306 = []
ssd1309 = []
# Test firmware only: at power-up, save the settings 300 times and read each
# back before running normally (src/stress.rs, TESTING.md 9.5c). Never for a
# module in use: it wears the settings sectors for nothing.
settings-stress = []
# Lot 7a comparison (journal/D-033): the OLED at 8 MHz, the rate the module
# was brought up at, the bus switching clock between it and the DAC at 22 MHz.
# The default runs both at 22 MHz.
oled-spi-8mhz = []

[lints]
workspace = true
