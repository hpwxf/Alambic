# Configuration for the C header generated from src/lib.rs by build.rs.
#
# The exported ABI intentionally uses only primitive C types (uint8_t, int32_t,
# bool, ...) in every function signature, so cbindgen never needs to reach
# into oc-core: the generated header is self-contained.

language = "C"
header = "/* Generated by cbindgen from crates/oc-vcv-ffi. Do not edit by hand. */"
include_guard = "OC_VCV_FFI_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
# `plugin.cpp` includes this header directly, so declarations must be wrapped
# in `extern "C" { ... }` when seen by a C++ compiler.
cpp_compat = true
documentation = true
documentation_style = "doxy"

[export]
prefix = ""

[fn]
prefix = ""
