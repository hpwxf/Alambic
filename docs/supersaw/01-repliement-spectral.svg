</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<g class="teal">
<rect x="98" y="90" width="4" height="150" rx="1"/><rect x="138" y="165" width="4" height="75" rx="1"/>
