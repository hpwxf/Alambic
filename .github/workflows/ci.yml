name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the test suite on macOS (slow and billed at a higher rate)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # NOTE: do not set `RUSTFLAGS` here. The environment variable *replaces*
  # `target.thumbv7em-none-eabihf.rustflags` from `.cargo/config.toml`, which
  # would drop `-Tt4link.x` and break the firmware link. Warnings are denied
  # per invocation instead.

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (host crates)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (firmware, ARM)
        run: >
          cargo clippy --package oc-firmware --package oc-board --package oc-realtime
          --target thumbv7em-none-eabihf -- -D warnings

  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features

  # macOS runners are slow and billed at a much higher rate, so this job only
  # runs on demand: Actions > CI > Run workflow, with "macos" ticked
  # (journal/D-017).
  test-macos:
    name: test (macos, on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features

  firmware:
    name: firmware image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build, measure and package
        run: |
          cargo xtask build
          cargo xtask size
          cargo xtask hex
      # The pre-flash gate (`validate_image` on the real ELF: architecture,
      # FCB, vector table, flash size) needs neither a module nor the loader,
      # so it runs here instead of only at flash time. It rewrites the same
      # `dist/oc-firmware.hex` and logs its SHA-256, so the uploaded artefact
      # can be compared with what a local `cargo xtask flash` prints
      # (journal/D-016).
      - name: Pre-flash validation (dry run)
        run: cargo xtask flash --dry-run
      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: oc-firmware-hex
          path: dist/oc-firmware.hex
          if-no-files-found: error

  bench:
    name: benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `--no-run` keeps CI time bounded while still catching benchmark
      # compilation rot; timing runs happen locally.
      - name: Compile benchmarks
        run: cargo bench --no-run
